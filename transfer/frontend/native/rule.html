<div class="transfer-rule" data-rule><div class="row g-3">
<div class="col-md-3"><label class="form-label">规则类型<select data-rule-field="kind" class="form-select"><option value="user" {% if rule.kind=='user' %}selected{% endif %}>用户</option><option value="role" {% if rule.kind=='role' %}selected{% endif %}>角色</option></select></label></div><div class="col-md-5"><label class="form-label">账号UID / 角色ID<input data-rule-field="id" class="form-control" maxlength="128" required value="{{ rule.id }}"></label></div><div class="col-md-4 d-flex align-items-center gap-3"><label><input type="checkbox" data-rule-field="send" {% if rule.send %}checked{% endif %}> 上传</label><label><input type="checkbox" data-rule-field="receive" {% if rule.receive %}checked{% endif %}> 下载</label><button type="button" data-remove-rule class="btn btn-outline-danger btn-sm">删除规则</button></div>
{% for key,label in [('dailyBytes','每日 / 字节'),('weeklyBytes','每周 / 字节'),('monthlyBytes','每月 / 字节'),('maxFileBytes','单文件 / 字节'),('concurrency','并发数')] %}<div class="col-md-6 col-xl-4"><label class="form-label">{{ label }}<input class="form-control" data-rule-field="{{ key }}" type="number" min="{{ 1 if key=='concurrency' else 0 }}" max="{{ 100 if key=='concurrency' else 9007199254740991 if key=='maxFileBytes' else 9007199254740991 }}" step="1" {% if key=='concurrency' %}required{% endif %} value="{{ rule.get(key) if rule.get(key) is not none else '' }}" placeholder="留空为不限"></label></div>{% endfor %}
</div></div>
