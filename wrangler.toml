name = "teacher-site-dual"
main = "src/worker.py"
compatibility_date = "2026-08-14"
compatibility_flags = ["python_workers", "disable_python_external_sdk"]
workers_dev = true

[build]
command = "python tools/prepare_cloudflare_build.py"
watch_dir = "app"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/admin/*", "/api/*", "/media/*", "/login", "/logout", "/register", "/sitemap.xml", "/sitemap.txt", "/sitemap-index.xml", "/robots.txt", "/security.txt", "/.well-known/security.txt", "/llms.txt"]

[[d1_databases]]
binding = "DB"
database_name = "teacher_site_sql_v2"
database_id = "198e1cee-b150-45c7-853d-366714a50116"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "teacher-site-media"

[vars]
SITE_URL = "https://example.com"
PUBLIC_MEDIA_BASE_URL = ""
ADMIN_EMAILS = ""
LOCAL_ADMIN_TOKEN = ""

[secrets]
required = ["TEACHER_SITE_AUTH_SECRET"]
