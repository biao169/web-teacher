  <details id="sync-defaults" open><summary>站点默认同步参数</summary><form data-defaults><div class="sync-parameter-grid">
<label>初始正文切片 <input class="form-control" name="slice_bytes" type="text" placeholder="填写 4KiB、256KiB、4m 或字节数" required><small class="sync-help">每次正文读取上限，支持 4KiB、256KiB、4m；大切片会增加单次资源消耗。</small></label>
<label>最小正文切片 <input class="form-control" name="min_slice_bytes" type="text" placeholder="最低4KiB" required><small class="sync-help">自动缩片的下限，最低 4KiB，不能超过初始切片。</small></label>
<label>快速重试次数 <input class="form-control" name="fast_retries" type="number" min="0" max="1000" placeholder="" required><small class="sync-help">连续无进度时快速重试的次数；耗尽后仍会慢速重试，有进度则重新计数。</small></label>
<label>慢速重试间隔（秒） <input class="form-control" name="slow_retry_seconds" type="number" min="60" max="1800" placeholder="" required><small class="sync-help">快速重试耗尽后的等待上限，60—1800 秒；不限制任务总时长。</small></label>
<label>正文切片自动调整 <select class="form-select" name="auto_shrink"><option value="true">启用</option><option value="false">关闭</option></select><small class="sync-help">资源压力时降低正文切片；至少 8 片成功且冷却 300 秒后缓慢恢复。R2 持久分段不随之改变。</small></label></div><button class="btn btn-primary">保存站点默认参数</button><p>仅用于后续新任务。已有任务保留自己的参数；已有计划未覆盖的字段在下次创建任务时读取新默认值。</p></form></details>
<p class="sync-muted">切片范围 4KiB—4MiB，支持输入 4m。切片是每次传输的上限，尾片可以不足4KiB。当前单条正文封装上限为1MiB，因此本站正文实际请求不会超过该条剩余字节。媒体采用独立流式分段。分片无需人工审核，中断后从已保存偏移续传。</p>
<form id="sync-retry-policy" class="sync-settings-block"><h3>快速重试等待</h3><label>快速重试等待（秒）<input class="form-control" name="fast_retry_seconds" type="number" min="10" max="300" value="10" required><small class="sync-help">范围 10—300 秒；控制连续失败后的快速恢复等待。</small></label><p>本站所有任务共用，保存后下一次失败生效；默认 10 秒。快速重试次数仍按任务设置，慢速等待最多 1800 秒。Worker 秒级推进需要调度器就绪，Cron 负责兜底，实际时间可能延迟。</p><button class="btn btn-secondary">保存重试等待</button><span role="status" data-retry-message></span></form>
