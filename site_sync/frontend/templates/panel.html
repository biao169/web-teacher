<section id="site-sync-panel" class="sync-panel panel" data-section="{{ sync_section }}" data-api="/admin/site-sync/api" data-peer-origin="{{ sync_peer.origin if sync_peer else '' }}" aria-labelledby="sync-title">
<header class="sync-heading"><div><h2 id="sync-title">{{ sync_sections[sync_section] }}</h2></div>
{% if sync_section in ['tasks','schedules'] %}<div class="sync-refresh-actions"><button class="btn btn-outline-primary" type="button" data-refresh>刷新状态</button><button class="btn btn-outline-secondary" type="button" data-auto-refresh aria-pressed="true">暂停自动刷新</button></div>{% endif %}</header>
<p data-message role="status" aria-live="polite"></p>
{% if sync_section in ['tasks','schedules'] %}<p class="sync-muted"><span data-auto-refresh-status>自动刷新已开启，每 60 秒一次</span>；暂停刷新不会暂停后台任务。时间：Asia/Shanghai（UTC+08:00） · <span data-updated>尚未刷新</span></p>{% endif %}
{% include 'sync/' ~ sync_section ~ '.html' %}
</section>
