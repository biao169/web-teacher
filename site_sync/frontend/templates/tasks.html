  <p data-retention-note class="sync-muted"></p>
  <h2 id="sync-tasks">任务列表与进度</h2>
  <nav class="sync-tabs" aria-label="任务范围"><button class="btn btn-outline-primary" type="button" data-view="all" aria-pressed="true">全部任务</button><button class="btn btn-outline-primary" type="button" data-view="running" aria-pressed="false">运行中</button><button class="btn btn-outline-primary" type="button" data-view="waiting" aria-pressed="false">待运行</button><button class="btn btn-outline-primary" type="button" data-view="paused" aria-pressed="false">已暂停</button><button class="btn btn-outline-primary" type="button" data-view="history" aria-pressed="false">已结束</button><button class="btn btn-outline-primary" type="button" data-trim>按保留期清理一条记录</button></nav>
  <div class="sync-table"><table class="table"><thead><tr><th>任务 ID / 对端</th><th>阶段与状态</th><th>持久化进度</th><th>连续失败 / 累计错误</th><th>时间</th><th>操作</th></tr></thead><tbody data-tasks></tbody></table></div>
  <div class="sync-pager"><label>每页行数 <select class="form-select" data-page-size><option>10</option><option selected>20</option></select></label><button class="btn btn-outline-primary" type="button" data-first>返回首页</button><button class="btn btn-outline-primary" type="button" data-prev disabled>上一页</button><span data-page-number>第1页</span><button class="btn btn-outline-primary" type="button" data-more hidden>下一页</button></div>
  <section data-detail hidden aria-labelledby="sync-detail-title"><h2 id="sync-detail-title">任务详情</h2><p data-detail-summary></p><p data-current-state></p><p class="sync-muted">摘要每60秒刷新；进度、诊断和日志仅在展开或点击刷新详情时加载。</p><button type="button" class="btn btn-outline-primary" data-detail-refresh>刷新详情 / 历史日志</button><p data-detail-error role="status"></p><p data-error></p>
    <div data-progress class="sync-progress-grid"></div><pre data-checkpoint class="sync-checkpoint"></pre>
    <details open><summary>历史日志快照 · 最近256条（每页30条）</summary><p data-log-storage class="sync-muted"></p><p class="sync-muted">记录执行阶段、进度、重试和代码位置；不记录正文、密钥及原始异常中的敏感信息。更早日志会滚动淘汰。</p><div class="sync-table"><table class="table"><thead><tr><th>时间 / 执行ID</th><th>事件 / 阶段</th><th>进度 / 重试</th><th>诊断详情</th></tr></thead><tbody data-logs></tbody></table></div><button class="btn btn-outline-primary" type="button" data-logs-first>最新日志</button><button class="btn btn-outline-primary" type="button" data-logs-more hidden>更早一页</button></details>
    <form data-settings><div class="sync-parameter-grid">
<label>初始正文切片 <input class="form-control" name="slice_bytes" type="text" placeholder="填写 4KiB、256KiB、4m 或字节数" required><small class="sync-help">每次正文读取上限，支持 4KiB、256KiB、4m；大切片会增加单次资源消耗。</small></label>
<label>最小正文切片 <input class="form-control" name="min_slice_bytes" type="text" placeholder="最低4KiB" required><small class="sync-help">自动缩片的下限，最低 4KiB，不能超过初始切片。</small></label>
<label>快速重试次数 <input class="form-control" name="fast_retries" type="number" min="0" max="1000" placeholder="" required><small class="sync-help">连续无进度时快速重试的次数；耗尽后仍会慢速重试，有进度则重新计数。</small></label>
<label>慢速重试间隔（秒） <input class="form-control" name="slow_retry_seconds" type="number" min="60" max="1800" placeholder="" required><small class="sync-help">快速重试耗尽后的等待上限，60—1800 秒；不限制任务总时长。</small></label>
<label>正文切片自动调整 <select class="form-select" name="auto_shrink"><option value="true">启用</option><option value="false">关闭</option></select><small class="sync-help">资源压力时降低正文切片；至少 8 片成功且冷却 300 秒后缓慢恢复。R2 持久分段不随之改变。</small></label></div><button class="btn btn-primary">保存任务设置</button><p>只影响当前任务。先暂停并等待执行租约结束；保存不会清空已传数据或更改偏移。R2存储分段不随正文切片改变。</p></form>
    <div class="sync-table"><table class="table"><thead><tr><th>批准</th><th>条目 ID</th><th>模块 / 来源记录</th><th>动作 / 状态</th></tr></thead><tbody data-items></tbody></table></div>
    <button class="btn btn-outline-primary" type="button" data-items-first>候选首页</button><button class="btn btn-outline-primary" type="button" data-items-more hidden>下一页候选</button><button class="btn btn-outline-primary" type="button" data-confirm hidden>批准所选条目</button><span data-selected></span>
  </section>
