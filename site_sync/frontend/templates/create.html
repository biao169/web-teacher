  <details id="sync-create" open><summary>新建手动拉取任务</summary><form data-create>
    <label>对端 <select class="form-select" name="peer" required></select><small class="sync-help">使用已保存并启用的对端连接。</small></label>
    <fieldset class="sync-scope" data-scope><legend>同步内容</legend><p class="sync-muted">点击卡片多选或全选；依赖项自动选入，取消依赖会同时取消依赖它的项目。部分选择合并记录、保留目标额外内容；全选替换网站内容。账号、角色、权限始终一起替换，完成后使用对端账号登录。</p><div class="sync-scope-tools"><button type="button" class="btn btn-outline-primary btn-sm" data-scope-all>全选内容</button><button type="button" class="btn btn-outline-primary btn-sm" data-scope-clear>清空选择</button><span data-scope-count aria-live="polite">未选择</span></div><div class="sync-scope-grid" data-scope-grid></div></fieldset>
    <label><input type="checkbox" name="auto_confirm" checked>自动确认本次拉取，后台完成全部流程<small class="sync-help">提交后自动完成本站批准和后续流程；推送仍由对端决定。</small></label><label><input type="checkbox" name="auto_delete" checked>自动确认时允许替换/删除（需删除权限）<small class="sync-help">分项恢复和账号替换需要此许可；仅全选全部内容时清理目标多余业务记录。</small></label><details><summary>本次参数覆盖（留空继承）</summary><div class="sync-parameter-grid">
<label>初始正文切片 <input class="form-control" name="slice_bytes" type="text" placeholder="留空继承站点默认值" ><small class="sync-help">每次正文读取上限，支持 4KiB、256KiB、4m；大切片会增加单次资源消耗。</small></label>
<label>最小正文切片 <input class="form-control" name="min_slice_bytes" type="text" placeholder="留空继承，最低4KiB" ><small class="sync-help">自动缩片的下限，最低 4KiB，不能超过初始切片。</small></label>
<label>快速重试次数 <input class="form-control" name="fast_retries" type="number" min="0" max="1000" placeholder="留空继承" ><small class="sync-help">连续无进度时快速重试的次数；耗尽后仍会慢速重试，有进度则重新计数。</small></label>
<label>慢速重试间隔（秒） <input class="form-control" name="slow_retry_seconds" type="number" min="60" max="1800" placeholder="留空继承" ><small class="sync-help">快速重试耗尽后的等待上限，60—1800 秒；不限制任务总时长。</small></label>
<label>正文切片自动调整 <select class="form-select" name="auto_shrink"><option value="">继承站点默认</option><option value="true">启用</option><option value="false">关闭</option></select><small class="sync-help">资源压力时降低正文切片；至少 8 片成功且冷却 300 秒后缓慢恢复。R2 持久分段不随之改变。</small></label></div></details><button class="btn btn-primary">拉取到本站</button><button class="btn btn-outline-primary" type="button" data-proposal>推送到对端</button><span>取消自动确认则等待本站批准；分项恢复只批准一次整个任务。推送由对端审核策略决定，以上复选框仅控制本站拉取。</span>
  <pre data-proposal-feedback role="status" aria-live="polite" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></form><details><summary>最近发出的推送请求</summary><p class="sync-help">任务在对端运行，此处显示最近20条发送结果；保留最近50条发送记录。</p><button type="button" class="btn btn-outline-primary btn-sm" data-outgoing-refresh>刷新发送记录</button><div data-outgoing-proposals></div></details></details>
