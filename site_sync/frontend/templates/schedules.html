  <h2 id="sync-schedules">定时拉取计划</h2><p>只在接收站启用。暂停或删除计划不会取消已经创建的任务；删除后不再产生新的定时任务。</p>
  <div class="sync-table"><table class="table"><thead><tr><th>计划 ID / 对端</th><th>范围 / 周期</th><th>状态</th><th>下次运行 / 最近任务</th><th>操作</th></tr></thead><tbody data-schedules></tbody></table></div>
  <button class="btn btn-outline-primary" type="button" data-schedules-more hidden>加载更多计划</button>
  <form data-schedule><h3 data-schedule-title>新增计划</h3><label>对端 <select class="form-select" name="peer" required></select><small class="sync-help">使用已保存并启用的对端连接。</small></label><fieldset class="sync-scope" data-scope><legend>同步内容</legend><p class="sync-muted">点击卡片多选或全选；依赖项自动选入，取消依赖会同时取消依赖它的项目。部分选择合并记录、保留目标额外内容；全选替换网站内容。账号、角色、权限始终一起替换，完成后使用对端账号登录。</p><div class="sync-scope-tools"><button type="button" class="btn btn-outline-primary btn-sm" data-scope-all>全选内容</button><button type="button" class="btn btn-outline-primary btn-sm" data-scope-clear>清空选择</button><span data-scope-count aria-live="polite">未选择</span></div><div class="sync-scope-grid" data-scope-grid></div></fieldset><label>周期（秒） <input class="form-control" name="interval_seconds" type="number" min="60" max="2592000" value="3600" required><small class="sync-help">两次计划触发的间隔；上一接收任务未结束时不会重叠创建。</small></label><label><input name="enabled" type="checkbox">启用自动拉取<small class="sync-help">开启后由服务端定时拉取，关闭页面也会继续。</small></label><details><summary>计划参数覆盖（留空继承）</summary><div class="sync-parameter-grid">
<label>初始正文切片 <input class="form-control" name="slice_bytes" type="text" placeholder="留空继承站点默认值" ><small class="sync-help">每次正文读取上限，支持 4KiB、256KiB、4m；大切片会增加单次资源消耗。</small></label>
<label>最小正文切片 <input class="form-control" name="min_slice_bytes" type="text" placeholder="留空继承，最低4KiB" ><small class="sync-help">自动缩片的下限，最低 4KiB，不能超过初始切片。</small></label>
<label>快速重试次数 <input class="form-control" name="fast_retries" type="number" min="0" max="1000" placeholder="留空继承" ><small class="sync-help">连续无进度时快速重试的次数；耗尽后仍会慢速重试，有进度则重新计数。</small></label>
<label>慢速重试间隔（秒） <input class="form-control" name="slow_retry_seconds" type="number" min="60" max="1800" placeholder="留空继承" ><small class="sync-help">快速重试耗尽后的等待上限，60—1800 秒；不限制任务总时长。</small></label>
<label>正文切片自动调整 <select class="form-select" name="auto_shrink"><option value="">继承站点默认</option><option value="true">启用</option><option value="false">关闭</option></select><small class="sync-help">资源压力时降低正文切片；至少 8 片成功且冷却 300 秒后缓慢恢复。R2 持久分段不随之改变。</small></label></div></details><button class="btn btn-primary">保存计划</button><button class="btn btn-outline-primary" type="button" data-schedule-reset>改为新增</button></form>
