<div class="public-reading-controls" data-reading-controls role="group" aria-label="{{ 'Text size' if lang=='en' else '字体大小' }}">
<button type="button" data-reading-choice="standard" aria-pressed="true" aria-label="{{ 'Standard text' if lang=='en' else '标准字体' }}" title="{{ 'Standard text' if lang=='en' else '标准字体' }}">A</button>
<button type="button" data-reading-choice="large" aria-pressed="false" aria-label="{{ 'Large text' if lang=='en' else '大字体' }}" title="{{ 'Large text' if lang=='en' else '大字体' }}">A<span aria-hidden="true">+</span></button>
</div>
