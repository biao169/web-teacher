{% macro fields(row, items, lang, template=false) -%}
{% for field,zh,en in items %}{% if template or (row.get(field) is not none and row.get(field) != '') %}<span class="content-field" data-copy-field data-public-field="{{ field }}"><span class="person-label">{{ en if lang=='en' else zh }}：</span><span data-public-value>{{ row.get(field,'') }}</span></span>{% endif %}{% endfor %}
{%- endmacro %}
