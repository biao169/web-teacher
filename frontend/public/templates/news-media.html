{% macro cover(row,media_map,css='content-cover') -%}
{% set category=(row.get('category') or '').strip() %}{% set src=media_map.get(row.get('cover_key')) %}
<div class="{{ css }} public-media" data-public-media role="img" aria-label="{{ category or 'News' }}">{% if src %}<img src="/media/{{ src }}" alt="" width="96" height="80" loading="lazy" decoding="async">{% endif %}<span data-media-fallback aria-hidden="true"{% if src %} hidden{% endif %}>{{ category[:1] or 'N' }}</span></div>
{%- endmacro %}
