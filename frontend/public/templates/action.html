{% extends 'public/layout.html' %}{% block public_content %}{% if kind=='contact' %}{% include 'public/contact-form.html' %}{% else %}<main class="container py-5" id="main"><h1>{{ '注册账号' if kind=='register' else '联系留言' }}</h1><form method="post"><input type="hidden" name="challenge" value="{{ challenge }}">{% if kind=='register' %}<label>用户名<input class="form-control" name="username" required></label><label>密码<input class="form-control" name="password" type="password" minlength="6" required></label>{% else %}<label>姓名<input class="form-control" name="name"></label><label>主题<input class="form-control" name="subject"></label><label>留言<textarea class="form-control" name="content" maxlength="5000" required></textarea></label>{% endif %}<label>邮箱<input class="form-control" name="email" type="email"></label><button class="btn btn-primary">提交</button><a href="/{{ lang }}">返回网站</a></form></main>{% endif %}{% endblock %}
