<!doctype html>
<html lang="@@LANG@@"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>@@TITLE@@ · @@SITE@@</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#24364a;background:#f4f7fa}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 15% 10%,#e0ecf6 0,transparent 50%),radial-gradient(ellipse at 95% 90%,#e7eeec 0,transparent 45%)}.brand{display:flex;align-items:center;gap:12px;padding:32px clamp(24px,6vw,88px);font-size:16px;font-weight:650;letter-spacing:.02em}.brand svg{width:32px;height:32px;color:#385b7e}main{min-height:calc(100svh - 150px);display:grid;place-items:center;padding:32px 20px 72px}.card{width:min(100%,620px);position:relative;padding:clamp(28px,6vw,58px);border:1px solid #fff;border-radius:24px;background:#ffffffed;box-shadow:0 20px 70px #213e5a0c}.eyebrow{font-size:11px;letter-spacing:.2em;color:#6a7f94;margin:0 0 24px}.icon{width:60px;height:60px;border-radius:18px;background:#edf3f8;color:#486e91;display:grid;place-items:center;margin-bottom:28px}.icon svg{width:30px;height:30px}h1{font-size:clamp(25px,4vw,33px);line-height:1.35;letter-spacing:-.025em;margin:0 0 16px;font-weight:650}.message{font-size:16px;line-height:1.8;color:#5d6e7f;margin:0 0 18px}.status{font-size:13px;color:#5a7389;display:flex;align-items:center;gap:9px;min-height:24px}.dot{width:7px;height:7px;border-radius:50%;background:#6c94ab}.reload{position:relative;z-index:2;display:inline-flex;margin-top:28px;align-items:center;gap:12px;background:#294d70;color:white;text-decoration:none;padding:13px 22px;border-radius:10px;font-weight:600;font-size:14px;transition:background .15s}.reload:hover{background:#1d3b57}.reload:focus-visible{outline:3px solid #8eb6d7;outline-offset:4px}.note{font-size:12px;line-height:1.8;color:#82909d;margin:22px 0 0}.trace{padding-top:24px;margin-top:26px;border-top:1px solid #eaf0f4;font:11px ui-monospace,monospace;letter-spacing:.04em;color:#8b99a5;overflow-wrap:anywhere}.foot{color:#8a98a4;text-align:center;font-size:11px;letter-spacing:.14em;padding:0 20px 24px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(max-width:480px){.brand{padding:24px}.card{border-radius:18px}.trace{margin-top:22px}main{padding-top:16px}}
.helper{position:fixed;right:24px;bottom:28px;z-index:1;width:min(108px,25vw);aspect-ratio:108/126;padding:0;border:0;background:none;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 7px 8px #294d701a)}.helper:active{cursor:grabbing}.helper:focus-visible{outline:2px solid #6688aa;outline-offset:3px;border-radius:22px}.helper svg{width:100%;height:100%;display:block;pointer-events:none}.helper .eyes{transform-origin:54px 45px;animation:blink 7s infinite}.helper-hint{font-size:9px;fill:#73889b}@keyframes blink{0%,94%,98%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}@media(prefers-reduced-motion:reduce){.helper .eyes{animation:none}}
</style><script src="/assets/public/js/public-recovery.js?v=0.16.088" defer></script></head>
<body><header class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 8h9l3 3 3-3h9v17h-9l-3 3-3-3H4V8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M16 11v17M8 13h4m-4 5h4m8-5h4m-4 5h4" stroke="currentColor" stroke-width="1.5"/></svg><span>@@SITE@@</span></header>
<main><section class="card" data-public-recovery data-attempted="@@ATTEMPTED@@" aria-labelledby="recovery-title"><p class="eyebrow">@@EYEBROW@@</p><div class="icon"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M25 12a10 10 0 1 0 1 9M25 5v8h-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1 id="recovery-title">@@TITLE@@</h1><p class="message" data-recovery-message>@@MESSAGE@@</p><div class="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span data-recovery-status>@@STATUS@@</span></div><button type="button" class="reload" data-recovery-reload data-recovery-url="@@URL@@">@@BUTTON@@ <span aria-hidden="true">↻</span></button><p class="note">@@NOTE@@</p><p class="trace">REQUEST · @@TRACE@@</p></section></main><button class="helper" data-recovery-helper type="button" aria-label="@@DRAG@@" title="@@DRAG@@"><svg viewBox="0 0 108 126" fill="none" aria-hidden="true"><ellipse cx="54" cy="108" rx="34" ry="5" fill="#dce5ec"/><path d="M34 86v15m38-15v15" stroke="#365b7b" stroke-width="10" stroke-linecap="round"/><path d="M30 104h13m24 0h13" stroke="#203d57" stroke-width="8" stroke-linecap="round"/><rect x="26" y="57" width="56" height="36" rx="15" fill="#6d94b0"/><path d="M40 62v23h27V62" fill="#375d7c"/><path d="M44 72h19v13H44z" fill="#e6edf3"/><path d="M29 68 17 82m62-14 12 10" stroke="#6d94b0" stroke-width="11" stroke-linecap="round"/><circle cx="18" cy="82" r="6" fill="#ead6bc"/><rect x="22" y="16" width="64" height="45" rx="19" fill="#f1e1ca" stroke="#d7c3a8"/><path d="M18 32h72M27 29c0-16 12-23 27-23s27 7 27 23" stroke="#4c7798" stroke-width="9" stroke-linecap="round"/><path d="M54 6v21" stroke="#96b3c9" stroke-width="7" stroke-linecap="round"/><g class="eyes" fill="#2f4e65"><circle cx="42" cy="44" r="3"/><circle cx="66" cy="44" r="3"/></g><path d="M48 52q6 5 12 0" stroke="#a77b64" stroke-width="2" stroke-linecap="round"/><path d="m83 82 12-26m-2 5a9 9 0 0 0 7-14l-5 7-6-3 3-8a9 9 0 0 0-7 13" stroke="#879bab" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="89" cy="79" r="6" fill="#ead6bc"/><text x="54" y="124" class="helper-hint" text-anchor="middle">@@DRAGSHORT@@</text></svg></button><footer class="foot">ACADEMIC WEBSITE</footer></body></html>
