{% extends 'admin/layout.html' %}{% from 'admin/native-help.html' import hint %}{% block content %}<section class="panel"><h1>修改密码</h1><form method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><p><label>原密码<input class="form-control" type="password" name="current" aria-describedby="help-current-password" autocomplete="current-password" required>{{ hint("help-current-password","必填；用于验证当前账号身份，密码不回显。") }}</label></p><p><label>新密码<input class="form-control" type="password" name="password" aria-describedby="help-new-password" minlength="6" maxlength="128" autocomplete="new-password" required>{{ hint("help-new-password","必填；6–128字符、UTF-8最多512字节。保存后撤销旧会话并重新登录。") }}</label></p><button class="btn btn-primary">保存并重新登录</button></form></section>{% endblock %}
