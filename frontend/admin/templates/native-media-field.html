{# All native media references share the same preview; selecting is separate from saving a reference. #}
<div class="native-media-field-preview" data-media-field-preview aria-label="{{ spec.label }}预览">
  <div class="native-media-field-canvas" data-field-canvas><span class="native-muted">未选择媒体</span></div>
  <small data-field-preview-status role="status"></small>
  <a class="btn btn-outline-secondary btn-sm" data-field-preview-open hidden target="_blank" rel="noopener" title="新标签页打开完整预览，不影响当前表单">↗ 完整预览</a>
</div>
