{# Safe JSON is the no-JavaScript fallback; enhanced controls share the same export endpoint. #}
<label class="visually-hidden" for="log-export-format">日志导出格式</label><select id="log-export-format" data-log-format class="form-select form-select-sm" title="JSON保留结构；CSV可用于表格软件"><option value="json">JSON</option><option value="csv">CSV</option></select><label class="native-log-detail-choice"><input type="checkbox" data-log-details title="包含服务端脱敏详情时最多5000条，否则最多20000条；文件上限24MiB"> 含脱敏详情</label><a class="btn btn-outline-secondary btn-sm" href="{{ export_url }}" data-log-export title="导出当前搜索、列筛选与排序的日志；不限制为当前页或勾选条目">⇩ 导出日志</a>
